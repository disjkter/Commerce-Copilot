name: commerce-copilot

services:
  db:
    image: pgvector/pgvector:0.8.7-pg14-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-commerce_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 640m

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-commerce_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-commerce_copilot}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-commerce_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-commerce_copilot}
      EMBEDDING_DEVICE: cpu
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m
    mem_limit: 768m

volumes:
  postgres_data:
