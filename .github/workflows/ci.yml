name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Python quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_PATH: runtime/ci.db
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      LOGISTICS_WEBHOOK_SECRET: ci-only-webhook-secret-not-for-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check tracked files for leaked credentials
        run: python scripts/check_repository_secrets.py

      - name: Compile source tree
        run: python -m compileall -q src tests

      - name: Check Alembic migration topology
        run: python scripts/check_migration_heads.py

      - name: Run regression tests
        run: python -m pytest --junitxml=artifacts/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: artifacts/junit.xml
          if-no-files-found: warn
          retention-days: 14
